symbol: SOL/USDC
timeframe: 1h
lookback_limit: 500
poll_seconds: 60

strategy:
  ema_period: 200
  rsi_period: 14
  rsi_entry: 25
  rsi_momentum: 55
  bollinger_period: 20
  bollinger_stddev: 2
  breakout_buffer_pct: 0.0
  take_profit_pct: 0.03
  bollinger_lower_buffer_pct: 0.0
  bollinger_exit_buffer_pct: 0.01
  atr_period: 14
  atr_stop_multiplier: 0.8

broker:
  initial_balance: 10000
  position_size_pct: 0.1
  fee_rate: 0.001

storage:
  database_path: sol_mean_reversion_bot/bot.db

logging:
  level: INFO
  file_path: sol_mean_reversion_bot/logs/bot.log
